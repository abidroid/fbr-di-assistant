[project]
name = "fbr-di-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abid", email = "abidroid1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.10.0",
    "asyncpg>=0.32.0",
    "docling>=2.151.0",
    "fastapi[standard]>=0.163.2",
    "fastembed>=0.9.1",
    "flagembedding>=1.4.2",
    "langchain-text-splitters>=1.1.3",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "qdrant-client>=1.20.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "tenacity>=9.2.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# E/F: errors, I: import order, UP: modern syntax, B: likely bugs, D: docstrings.
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names already say what they check; a docstring on each would repeat it.
"tests/**" = ["D103"]
# Data scripts hold long FAQ text and URLs that cannot be wrapped.
"scripts/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# Tests share the fixtures' event loop: database connections belong to the loop
# that opened them and fail if used from another one.
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    # In-memory Qdrant ignores payload indexes; the real server uses them.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]
