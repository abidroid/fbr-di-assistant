[project]
name = "fbr-di-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abid", email = "abidroid1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.10.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.163.2",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "qdrant-client>=1.20.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "tenacity>=9.2.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# E/F: errors, I: import order, UP: modern syntax, B: likely bugs, D: docstrings.
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names already say what they check; a docstring on each would repeat it.
"tests/**" = ["D103"]
# Data scripts hold long FAQ text and URLs that cannot be wrapped.
"scripts/**" = ["E501"]
