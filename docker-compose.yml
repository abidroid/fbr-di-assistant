# Development services: Qdrant only. Production uses docker-compose.prod.yml (api, qdrant, caddy).
services:
  qdrant:
    # Pinned to match qdrant-client 1.20, so client and server speak the same API.
    image: qdrant/qdrant:v1.20.1
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API + dashboard at http://localhost:6333/dashboard
      - "6334:6334" # gRPC
    volumes:
      # Named volume: vectors survive container restarts and stay out of the repo.
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
